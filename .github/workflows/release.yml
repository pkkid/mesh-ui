# Release builds (docs/platform/build-and-release.md#ci).
# A `v*` tag builds every OS and creates a DRAFT GitHub Release; the
# maintainer reviews and publishes it. A manual run with dry_run builds the
# same packages and uploads them as workflow artifacts, with no release.
# Builds always pass --publish never (the pnpm dist scripts); only the
# publish job uploads, with gh. No job uses a secret or an environment:
# macOS and Windows ship unsigned for now (build-and-release.md#signing).
# Update files are every channel's *.yml (latest, or beta for a -beta.N
# version).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and upload workflow artifacts only, no release (a release also needs a v* tag ref)
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  mac:
    name: mac (universal)
    runs-on: macos-latest
    # Unsigned for now: no `environment: release` and no secrets. When
    # Developer ID signing arrives (build-and-release.md#later-developer-id-and-notarization),
    # add the environment here and the signing env on the pnpm dist step.
    timeout-minutes: 60
    # Never look for a signing identity in the keychain; electron-builder.yml
    # sets an ad-hoc identity ("-") and notarize: false.
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:dir
      - run: pnpm dist:smoke
      - run: pnpm ui:shot --route '#/overview' --out ui-shot-mac.png
      - uses: actions/upload-artifact@v7
        with:
          name: ui-shot-mac
          path: ui-shot-mac.png
          if-no-files-found: error
      # Universal dmg and zip, ad-hoc signed, not notarized.
      - run: pnpm dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error

  win:
    name: win (x64, arm64)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # x64 only, so dist:smoke finds the runner's own arch in dist/.
      - run: pnpm dist:dir --x64
      - run: pnpm dist:smoke
      # No slash in the route: Git bash would rewrite '#/overview' as a Windows
      # path. ui-shot turns 'overview' into '#/overview'.
      - run: pnpm ui:shot --route overview --out ui-shot-win.png
      - uses: actions/upload-artifact@v7
        with:
          name: ui-shot-win
          path: ui-shot-win.png
          if-no-files-found: error
      # Unsigned for now (build-and-release.md#windows): NSIS x64 and arm64
      # plus the portable zips. makensis cannot open includes past MAX_PATH
      # (260), and electron-builder's templates under the default pnpm dlx
      # cache (AppData\Local\pnpm-cache\dlx\...) reach 261, so the cache
      # moves to a short path for this step.
      - run: pnpm dist
        env:
          pnpm_config_cache_dir: ${{ runner.temp }}\pc
      - uses: actions/upload-artifact@v7
        with:
          name: dist-win
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # rpmbuild for the rpm target, zsyncmake for the AppImage .zsync files.
      # Ubuntu 24.04 blocks the unprivileged user
      # namespaces Chromium's sandbox needs, which the smoke and ui:shot use.
      - run: |
          sudo apt-get update
          sudo apt-get install -y rpm zsync
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # electron-builder's bundled fpm is x86_64 only; arm64 uses a system fpm.
      - if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm -v 1.16.0
          echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:dir
      - run: pnpm dist:smoke
      - run: pnpm ui:shot --route '#/overview' --out "ui-shot-linux-${{ matrix.arch }}.png"
      - uses: actions/upload-artifact@v7
        with:
          name: ui-shot-linux-${{ matrix.arch }}
          path: ui-shot-linux-${{ matrix.arch }}.png
          if-no-files-found: error
      - run: pnpm dist
      # Update information for AppImage managers (Gear Lever); also fixes the
      # AppImage's sha512 in the update files and writes its .zsync.
      - run: node scripts/appimage-update-info.mjs dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error

  publish:
    name: publish (draft)
    needs: [mac, win, linux]
    # Only from a v* tag: a tag push, or a manual run on a tag with dry_run off.
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || !inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: release
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: node scripts/checksums.mjs release
      - run: node scripts/release-notes.mjs > "$RUNNER_TEMP/notes.md"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" release/* --draft "${prerelease[@]}" --verify-tag \
            --title "Mesh UI ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
